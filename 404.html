<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <title>Página no encontrada · 2DATO</title>
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/assets/favicon.png"
            media="(prefers-color-scheme: light)"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/assets/favicon-dark.png"
            media="(prefers-color-scheme: dark)"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="192x192"
            href="/assets/favicon-192.png"
            media="(prefers-color-scheme: light)"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="192x192"
            href="/assets/favicon-dark-192.png"
            media="(prefers-color-scheme: dark)"
        />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="stylesheet" href="/styles.css" />
        <style>
            .nf {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
                padding: 32px;
                text-align: center;
            }
            .nf h1 {
                color: var(--navy);
            }
            .nf p {
                color: var(--navy-75);
            }
        </style>
    </head>
    <body>
        <main class="nf">
            <a href="/" class="wordmark" aria-label="2DATO">
                <img
                    src="/assets/logo-2dato@1x.png"
                    srcset="/assets/logo-2dato@1x.png 1x, /assets/logo-2dato@2x.png 2x"
                    alt="2DATO"
                    width="80"
                    height="44"
                    decoding="async"
                />
            </a>
            <div lang="es">
                <h1>Página no encontrada</h1>
                <p>La dirección que buscas no existe o fue movida.</p>
            </div>
            <div lang="en">
                <h1>Page not found</h1>
                <p>The address you are looking for does not exist or has been moved.</p>
            </div>
            <a class="btn btn-primary" href="/">Volver al inicio · Back home</a>
        </main>
    </body>
</html>
